name: Tag release after develop merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  tag-release:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop'
    name: Create release tag
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read package version
        id: version
        run: |
          VERSION=$(python -c "import jam; print('.'.join(map(str, jam.__version__)))")
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version format
        run: |
          if ! [[ "${{ steps.version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version: ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${{ steps.version.outputs.version }} already exists."
            exit 1
          fi

      - name: Create release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
